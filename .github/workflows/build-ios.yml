name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.app || true
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Configure Xcode Environment
        run: |
          NODE_PATH=$(which node)
          echo "Configuring Node for Xcode build phases: $NODE_PATH"
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          echo "export PATH=\"$(dirname "$NODE_PATH"):$PATH:/opt/homebrew/bin:/usr/local/bin\"" >> ios/.xcode.env.local
          cat ios/.xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod install || (pod repo update && pod install)

      - name: Compile iOS App with Xcode
        run: |
          set -o pipefail
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          PROJECT_FILE=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          
          echo "Found Workspace: $WORKSPACE"
          echo "Found Project: $PROJECT_FILE"
          echo "Determined Main App Scheme: $PROJECT_NAME"
          
          # Target the primary App Scheme (not CocoaPods sub-libraries like EXApplication)
          SCHEME="$PROJECT_NAME"
          
          # Build with ad-hoc signing (CODE_SIGN_IDENTITY="-") which satisfies Xcode 16 framework requirements without Apple Team certificate
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "❌ Xcode build failed! Showing error summary:"
              grep -i "error:" xcodebuild.log || true
              echo "--- Last 60 lines of build log ---"
              tail -n 60 xcodebuild.log
              exit 1
            }

      - name: Package into .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          echo "Found App Bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build/Build/Products/Release-iphoneos"
            ls -la build/Build/Products/ || true
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -y OrderBook.ipa Payload
          ls -lh OrderBook.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderBook-iOS-IPA
          path: build/OrderBook.ipa
          retention-days: 14
