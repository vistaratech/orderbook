name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app || sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native iOS Project (Expo Prebuild)
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Configure Xcode Environment & Patch Swift Tools
        run: |
          NODE_PATH=$(which node)
          echo "Configuring Node for Xcode build phases: $NODE_PATH"
          echo "export NODE_BINARY=$NODE_PATH" > ios/.xcode.env.local
          echo "export PATH=\"$(dirname "$NODE_PATH"):$PATH:/opt/homebrew/bin:/usr/local/bin\"" >> ios/.xcode.env.local
          cat ios/.xcode.env.local
          
          # Patch any Swift Package requesting tools 6.2.0 to 6.0.0 for maximum compatibility
          find ios -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2.0/swift-tools-version: 6.0.0/g' {} + 2>/dev/null || true
          find node_modules -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2.0/swift-tools-version: 6.0.0/g' {} + 2>/dev/null || true

      - name: Install CocoaPods
        run: |
          cd ios
          pod install || (pod repo update && pod install)
          
          # Patch any Pods cloned Package.swift files
          find ios/Pods -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2.0/swift-tools-version: 6.0.0/g' {} + 2>/dev/null || true

      - name: Compile iOS App with Xcode
        run: |
          set -o pipefail
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          PROJECT_FILE=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
          
          echo "Found Workspace: $WORKSPACE"
          echo "Found Project: $PROJECT_FILE"
          echo "Determined Main App Scheme: $PROJECT_NAME"
          
          SCHEME="$PROJECT_NAME"
          
          # Build with ad-hoc signing to satisfy framework signing in Xcode 16
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE="Manual" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "❌ Xcode build failed! Full error context:"
              grep -n -C 5 -i "error:" xcodebuild.log || true
              exit 1
            }

      - name: Package into .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/Build/Products -name "*.app" -not -path "*/Pods-*" -not -path "*/EX*" | head -n 1)
          echo "Found App Bundle: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "Error: No .app bundle found in build/Build/Products"
            find build -name "*.app" || true
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r -y OrderBook.ipa Payload
          ls -lh OrderBook.ipa

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrderBook-iOS-IPA
          path: build/OrderBook.ipa
          retention-days: 14
